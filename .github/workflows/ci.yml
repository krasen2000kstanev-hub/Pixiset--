name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build-time placeholders; real values live in the deployment env.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
          AUTH_SECRET: ci-placeholder-secret-ci-placeholder-secret
          NEXTAUTH_SECRET: ci-placeholder-secret-ci-placeholder-secret
          GALLERY_ACCESS_SECRET: ci-placeholder-secret-ci-placeholder-x
          S3_BUCKET: ci-bucket
          NEXT_PUBLIC_CDN_URL: https://cdn.example.com
          AWS_REGION: eu-central-1
