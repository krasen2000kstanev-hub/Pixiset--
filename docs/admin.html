<!doctype html>
<html lang="bg">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixiset — Admin</title>
<style>
body{margin:0;background:#171614;color:#f5f1e8;font:16px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:48px 6vw}h1{font:48px Georgia,serif;font-weight:400}.card{border:1px solid #ffffff22;padding:24px;margin:24px 0;background:#ffffff08}input,button{font:inherit;padding:12px;border-radius:4px;border:1px solid #ffffff33;background:#ffffff12;color:inherit}input{display:block;width:100%;margin:8px 0 12px;box-sizing:border-box}button{cursor:pointer;background:#d7ad76;color:#171614;border:0;font-weight:600}.muted{color:#ffffff99}.gallery{padding:12px 0;border-top:1px solid #ffffff22}.meta{color:#ffffff99;font-size:13px;margin:8px 0}.progress{height:8px;background:#ffffff18;border-radius:99px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;width:0;background:#d7ad76;transition:width .15s}.file{font-size:13px;color:#fff9;margin:5px 0}
</style>
<main>
  <p class="muted">PIX ISET / TEAM</p><h1>Admin gallery</h1>
  <div id="login" class="card"><p>Влез като член на екипа, за да управляваш галериите.</p><button id="loginButton">Вход с AWS</button></div>
  <section id="app" hidden>
    <div class="card"><form id="create"><label>Име на галерията<input name="title" required placeholder="Сватба — Иванови"></label><label>Описание<input name="description" placeholder="Септември 2026"></label><button>Създай галерия</button></form></div>
    <div class="card"><h2>Моите галерии</h2><div id="list" class="muted">Зареждане…</div></div>
  </section>
</main>
<script>
const API='https://9hi9hsm4n1.execute-api.us-east-1.amazonaws.com';
const COGNITO='https://pixiset-gallery-674948790853.auth.us-east-1.amazoncognito.com';
const CLIENT='3fleqt4pgl9a7hr5snddok64qs';
const REDIRECT=location.origin+location.pathname;
let token=sessionStorage.getItem('pixiset_token');
if(location.hash.includes('access_token=')){token=new URLSearchParams(location.hash.slice(1)).get('access_token');sessionStorage.setItem('pixiset_token',token);history.replaceState({},'',REDIRECT)}
const api=(path,opt={})=>fetch(API+path,{...opt,headers:{'content-type':'application/json',Authorization:`Bearer ${token}`}}).then(async r=>{if(!r.ok)throw new Error(`${r.status}: ${await r.text()}`);return r.json()});
function show(){document.querySelector('#login').hidden=!!token;document.querySelector('#app').hidden=!token;if(token)load()}
document.querySelector('#loginButton').onclick=()=>location.href=`${COGNITO}/oauth2/authorize?response_type=token&client_id=${CLIENT}&redirect_uri=${encodeURIComponent(REDIRECT)}&scope=openid`;
document.querySelector('#create').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api('/admin/galleries',{method:'POST',body:JSON.stringify({title:f.get('title'),description:f.get('description')})});e.target.reset();load()}catch(err){alert(err.message)}};
const mb=n=>(n/1024/1024).toFixed(2)+' MB';
async function load(){const box=document.querySelector('#list');try{const data=await api('/admin/galleries');box.innerHTML=data.galleries.length?data.galleries.map(g=>`<div class="gallery"><strong>${g.title||'Без име'}</strong><br><span class="muted">${g.status} · ${g.id}</span><div id="summary-${g.id}" class="meta">Снимки в галерията: ${g.photoCount||0} · Общо: ${mb(g.photoBytes||0)}</div><div id="files-${g.id}"></div><input type="file" multiple accept="image/*" data-gallery="${g.id}"><button data-upload="${g.id}">Качи снимки</button><span id="status-${g.id}" class="muted"></span><div class="progress"><i id="bar-${g.id}"></i></div></div>`).join(''):'Все още няма галерии.';await Promise.all(data.galleries.map(loadPhotos))}catch(err){box.textContent=err.message}}
async function loadPhotos(g){try{const data=await api(`/admin/galleries/${g.id}/photos`);const total=data.photos.reduce((n,p)=>n+(p.size||0),0);document.querySelector(`#summary-${g.id}`).textContent=`Качени: ${data.photos.length} снимки · ${mb(total)}`;document.querySelector(`#files-${g.id}`).innerHTML=data.photos.map(p=>`<div class="file">${p.filename} · ${mb(p.size||0)}</div>`).join('')}catch(err){document.querySelector(`#summary-${g.id}`).textContent=err.message}}
function put(url,file,onProgress){return new Promise((resolve,reject)=>{const x=new XMLHttpRequest();x.open('PUT',url);x.setRequestHeader('Content-Type',file.type);x.upload.onprogress=e=>e.lengthComputable&&onProgress(e.loaded);x.onload=()=>x.status<300?resolve():reject(new Error(`S3 ${x.status}`));x.onerror=()=>reject(new Error('Мрежова грешка'));x.send(file)})}
document.querySelector('#list').onclick=async e=>{const id=e.target.dataset.upload;if(!id)return;const input=document.querySelector(`input[data-gallery="${id}"]`);const status=document.querySelector(`#status-${id}`);const bar=document.querySelector(`#bar-${id}`);if(!input.files.length)return status.textContent=' Избери снимки.';const files=[...input.files],total=files.reduce((n,f)=>n+f.size,0);let done=0;status.textContent=` 0 / ${files.length} · 0 / ${mb(total)}`;try{for(const file of files){const {url}=await api(`/admin/galleries/${id}/upload`,{method:'POST',body:JSON.stringify({filename:file.name,contentType:file.type,size:file.size})});await put(url,file,loaded=>{const current=done+loaded;bar.style.width=`${Math.round(current/total*100)}%`;status.textContent=` ${done} / ${files.length} · ${mb(current)} / ${mb(total)}`});done++;}status.textContent=` Готово: ${done} снимки · ${mb(total)}`;await loadPhotos({id});input.value=''}catch(err){status.textContent=` Грешка: ${err.message}`}};
show();
</script>
