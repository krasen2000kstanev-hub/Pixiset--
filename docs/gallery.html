<!doctype html><html lang="bg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gallery</title>
<style>*{box-sizing:border-box}body{margin:0;background:#171614;color:#f5f1e8;font:16px system-ui,sans-serif}main{max-width:1900px;margin:auto;padding:28px 2vw}.muted{color:#fff9}.eyebrow{color:#d7ad76;font-size:12px;letter-spacing:.3em;text-transform:uppercase}.hero{width:100%;max-height:70vh;object-fit:cover;margin-top:24px}.grid{columns:5 240px;column-gap:3px;margin-top:28px}.grid img{display:block;width:100%;height:auto;margin:0 0 3px;break-inside:avoid;cursor:zoom-in}.empty{margin-top:50px;color:#fff9}@media(max-width:1000px){.grid{columns:3 220px}}@media(max-width:600px){main{padding:20px 8px}.grid{columns:2 150px;column-gap:3px}.grid img{margin-bottom:3px}}</style>
<main><p class="eyebrow">Private gallery</p><h1 id="title">Зареждане…</h1><p id="description" class="muted"></p><img id="cover" class="hero" hidden alt="Корица"><div id="grid" class="grid"></div></main>
<script>
const API='https://9hi9hsm4n1.execute-api.us-east-1.amazonaws.com';const id=new URLSearchParams(location.search).get('id');
fetch(`${API}/galleries/${encodeURIComponent(id||'')}`).then(async r=>{if(!r.ok)throw new Error('Галерията не е намерена');return r.json()}).then(({gallery,photos})=>{document.title=gallery.title;document.querySelector('#title').textContent=gallery.title;document.querySelector('#description').textContent=gallery.description||'';const cover=photos.find(p=>p.id===gallery.coverPhotoId);if(cover){const hero=document.querySelector('#cover');hero.src=cover.url;hero.alt=gallery.title;hero.hidden=false}document.querySelector('#grid').innerHTML=photos.length?photos.map((p,i)=>`<img src="${p.url}" alt="Снимка ${i+1}" loading="lazy">`).join(''):'<p class="empty">Все още няма качени снимки.</p>'}).catch(e=>{document.querySelector('#title').textContent='Няма достъп';document.querySelector('#description').textContent=e.message});
</script>
