<!doctype html><html lang="bg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gallery</title>
<link rel="stylesheet" href="mobile.css?v=1"><link rel="stylesheet" href="cover.css?v=1"><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif}main{max-width:1900px;margin:auto;padding:28px 2vw}.eyebrow{color:#a66d4d;font-size:12px;letter-spacing:.3em;text-transform:uppercase}.grid{columns:5 240px;column-gap:3px;margin-top:28px}.photoTile{position:relative;display:block;break-inside:avoid;margin:0 0 3px}.grid img{display:block;width:100%;height:auto;cursor:zoom-in}.photoDownload{position:absolute;right:10px;bottom:10px;min-height:44px;padding:10px 14px;border:0;border-radius:999px;background:#fff;color:#332b25;cursor:pointer;opacity:0;transition:opacity .2s}.photoTile:hover .photoDownload,.photoTile:focus-within .photoDownload{opacity:1}.empty{margin-top:50px}@media(max-width:1000px){.grid{columns:3 220px}}@media(max-width:600px){main{padding:20px 10px}.grid{columns:2 150px;column-gap:3px}.photoDownload{opacity:1;right:5px;bottom:5px;padding:8px 10px}}</style>
<main><p class="eyebrow">Private gallery</p><section class="coverHero"><img id="cover" hidden alt="Корица" fetchpriority="high"><div class="coverCopy"><h1 id="coverTitle">Зареждане…</h1><p id="coverDate"></p><button class="coverButton" id="viewGallery">Виж галерията</button></div></section><div class="galleryInfo"><h2 id="title">Зареждане…</h2><small id="description"></small></div><div id="selectionTools" class="selectionTools" hidden></div><div id="sets"></div><div id="grid" class="grid"></div></main>
<script>
const API='https://9hi9hsm4n1.execute-api.us-east-1.amazonaws.com';const params=new URLSearchParams(location.search);const id=params.get('id');const slug=params.get('slug');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch(`${API}/galleries/${id?encodeURIComponent(id):'slug/'+encodeURIComponent(slug||'')}`).then(async r=>{if(!r.ok)throw new Error('Галерията не е намерена');return r.json()}).then(({gallery,photos})=>{document.title=gallery.title;document.querySelector('#title').textContent=gallery.title;document.querySelector('#coverTitle').textContent=gallery.title;document.querySelector('#description').textContent=gallery.description||'';document.querySelector('#coverDate').textContent=new Date(gallery.displayDate||gallery.createdAt||Date.now()).toLocaleDateString('bg-BG',{day:'numeric',month:'long',year:'numeric'});document.querySelector('#viewGallery').onclick=()=>document.querySelector('#sets').scrollIntoView({behavior:'smooth'});const cover=photos.find(p=>p.id===gallery.coverPhotoId)||photos[0];if(cover){const hero=document.querySelector('#cover');hero.src=cover.originalUrl||cover.url;hero.dataset.original=cover.originalUrl||cover.url;hero.alt=gallery.title;hero.hidden=false}const groups={};photos.forEach(p=>(groups[p.setName||'Highlights']??=[]).push(p));document.querySelector('#sets').innerHTML=Object.entries(groups).map(([name,items])=>`<h2>${esc(name)} <small class="muted">(${items.length})</small></h2><div class="grid">${items.map((p,i)=>`<figure class="photoTile"><img src="${esc(p.url)}" data-original="${esc(p.originalUrl||p.url)}" alt="${esc(name)} — снимка ${i+1}" loading="lazy" decoding="async"><button type="button" class="photoDownload" data-photo-download="${esc(p.originalUrl||p.url)}" data-filename="${esc(p.filename||`photo-${i+1}`)}">↓ Свали</button></figure>`).join('')}</div>`).join('')||'<p class="empty">Все още няма качени снимки.</p>'}).catch(e=>{document.querySelector('#coverTitle').textContent='Няма достъп';document.querySelector('#title').textContent='Няма достъп';document.querySelector('#description').textContent=e.message});
</script>
<script>window.PIXISET_DOWNLOAD_API=API;</script><script src="gallery-actions.js?v=7"></script><script src="gallery-selection.js?v=3"></script><script src="share-fix.js?v=3"></script><script src="download-fix.js?v=4"></script><script src="performance.js?v=1"></script><script src="back-to-top.js?v=2"></script>
