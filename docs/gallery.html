<!doctype html><html lang="bg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gallery</title>
<link rel="stylesheet" href="mobile.css?v=1"><style>*{box-sizing:border-box}body{margin:0;background:#171614;color:#f5f1e8;font:16px system-ui,sans-serif}main{max-width:1900px;margin:auto;padding:28px 2vw}.muted{color:#fff9}.eyebrow{color:#d7ad76;font-size:12px;letter-spacing:.3em;text-transform:uppercase}.hero{width:100%;max-height:70vh;object-fit:cover;margin-top:24px}.grid{columns:5 240px;column-gap:3px;margin-top:28px}.grid img{display:block;width:100%;height:auto;margin:0 0 3px;break-inside:avoid;cursor:zoom-in}.empty{margin-top:50px;color:#fff9}@media(max-width:1000px){.grid{columns:3 220px}}@media(max-width:600px){main{padding:20px 8px}.grid{columns:2 150px;column-gap:3px}.grid img{margin-bottom:3px}}</style>
<main><p class="eyebrow">Private gallery</p><h1 id="title">Зареждане…</h1><p id="description" class="muted"></p><img id="cover" class="hero" hidden alt="Корица"><div id="sets"></div><div id="grid" class="grid"></div></main>
<script>
const API='https://9hi9hsm4n1.execute-api.us-east-1.amazonaws.com';const params=new URLSearchParams(location.search);const id=params.get('id');const slug=params.get('slug');
fetch(`${API}/galleries/${id?encodeURIComponent(id):'slug/'+encodeURIComponent(slug||'')}`).then(async r=>{if(!r.ok)throw new Error('Галерията не е намерена');return r.json()}).then(({gallery,photos})=>{document.title=gallery.title;document.querySelector('#title').textContent=gallery.title;document.querySelector('#description').textContent=gallery.description||'';const cover=photos.find(p=>p.id===gallery.coverPhotoId);if(cover){const hero=document.querySelector('#cover');hero.src=cover.url;hero.dataset.original=cover.originalUrl||cover.url;hero.alt=gallery.title;hero.hidden=false}const groups={};photos.forEach(p=>(groups[p.setName||'Highlights']??=[]).push(p));document.querySelector('#sets').innerHTML=Object.entries(groups).map(([name,items])=>`<h2>${name} <small class="muted">(${items.length})</small></h2><div class="grid">${items.map((p,i)=>`<img src="${p.url}" data-original="${p.originalUrl||p.url}" alt="${name} — снимка ${i+1}" loading="lazy" decoding="async">`).join('')}</div>`).join('')||'<p class="empty">Все още няма качени снимки.</p>'}).catch(e=>{document.querySelector('#title').textContent='Няма достъп';document.querySelector('#description').textContent=e.message});
</script>
<script src="gallery-actions.js?v=3"></script><script src="share-fix.js?v=3"></script><script src="download-fix.js?v=2"></script><script src="performance.js?v=1"></script><script src="back-to-top.js?v=2"></script>
