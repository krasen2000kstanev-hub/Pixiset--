<!doctype html><html lang="bg"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gallery</title>
<style>*{box-sizing:border-box}body{margin:0;background:#171614;color:#f5f1e8;font:16px system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:42px 5vw}.muted{color:#fff9}.eyebrow{color:#d7ad76;font-size:12px;letter-spacing:.3em;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:54px}.grid img{width:100%;height:320px;object-fit:cover}.empty{margin-top:50px;color:#fff9}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr);gap:6px}.grid img{height:230px}}</style>
<main><p class="eyebrow">Private gallery</p><h1 id="title">Зареждане…</h1><p id="description" class="muted"></p><div id="grid" class="grid"></div></main>
<script>
const API='https://9hi9hsm4n1.execute-api.us-east-1.amazonaws.com';const id=new URLSearchParams(location.search).get('id');
fetch(`${API}/galleries/${encodeURIComponent(id||'')}`).then(async r=>{if(!r.ok)throw new Error('Галерията не е намерена');return r.json()}).then(({gallery,photos})=>{document.title=gallery.title;document.querySelector('#title').textContent=gallery.title;document.querySelector('#description').textContent=gallery.description||'';document.querySelector('#grid').innerHTML=photos.length?photos.map((p,i)=>`<img src="${p.url}" alt="Снимка ${i+1}" loading="lazy">`).join(''):'<p class="empty">Все още няма качени снимки.</p>'}).catch(e=>{document.querySelector('#title').textContent='Няма достъп';document.querySelector('#description').textContent=e.message});
</script>
